services:
  - type: web
    name: offergo-mvp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python resume_review_server.py
    envVars:
      - key: RESUME_REVIEW_HOST
        value: 0.0.0.0
      - key: RESUME_REVIEW_PORT
        value: 10000
